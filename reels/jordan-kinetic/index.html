<!doctype html>
<html lang="en"

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root{--bg:#090d12;--ink:#e6ebef;--gold:#c4aa6c;--muted:#9fadba}
      *{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
      body{font-family:Inter,Arial,sans-serif;color:var(--ink)}
      #stage{position:relative;width:1080px;height:1920px;overflow:hidden}
      .frame-fill{position:absolute;inset:0;background-color:var(--bg);background-image:radial-gradient(circle at 78% 21%,rgba(196,170,108,.19),transparent 33%),repeating-linear-gradient(90deg,transparent 0,transparent 88px,rgba(196,170,108,.07) 89px,transparent 90px)}
      #stage[data-variant="diagnostic-kinetic-v1b"] .frame-fill{background-image:radial-gradient(circle at 18% 72%,rgba(196,170,108,.19),transparent 34%),repeating-linear-gradient(90deg,transparent 0,transparent 88px,rgba(196,170,108,.07) 89px,transparent 90px)}

      .clip{position:absolute;inset:0}.scene{position:absolute;inset:0;opacity:0}
      .meta{font-family:monospace;font-size:22px;font-weight:700;color:var(--gold);letter-spacing:.14em;text-transform:uppercase}
      .support{font-size:42px;line-height:1.2;color:var(--muted)}.hero{font-size:112px;font-weight:900;line-height:.94;letter-spacing:-.045em;text-transform:uppercase;overflow-wrap:anywhere}
      .gold{color:var(--gold)}.scan{position:absolute;z-index:20;top:930px;left:135px;width:810px;height:4px;background:var(--gold);box-shadow:0 0 28px rgba(196,170,108,.56);transform-origin:left center}
      .scan:after{position:absolute;top:-8px;right:-10px;width:20px;height:20px;content:"";border:3px solid var(--gold);border-radius:50%;background:var(--bg)}
      #scene-hook .meta{position:absolute;top:310px;right:135px}#scene-hook .copy{position:absolute;top:520px;left:135px;width:810px}#scene-hook .support{margin-bottom:28px}

      #scene-compare .hero{font-size:82px;white-space:nowrap;overflow-wrap:normal}#scene-compare .top{top:315px}#scene-compare .bottom{bottom:445px;text-align:right}.neq{position:absolute;z-index:4;top:720px;left:410px;width:260px;color:var(--gold);font-size:240px;font-weight:900;text-align:center}
      #scene-diagnostic .meta{position:absolute;top:315px;left:135px}#scene-diagnostic .copy{position:absolute;top:610px;left:135px;width:790px}#scene-diagnostic .hero{font-size:98px}.box{display:inline-block;margin-top:38px;padding:25px 30px;border:4px solid var(--gold);color:var(--gold)}
      #scene-cta .copy{position:absolute;top:540px;left:135px;width:810px}#scene-cta .support{margin-bottom:42px}#scene-cta .hero{font-size:104px}.url{position:absolute;top:1120px;right:135px;font-size:58px;font-weight:900;color:var(--gold)}
      #scene-cta .source{position:absolute;right:135px;bottom:490px;max-width:760px;text-align:right;font-size:20px;color:var(--muted)}
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="jordan-kinetic-reel" data-start="0" data-duration="9" data-fps="30" data-width="1080" data-height="1920">
      <div class="frame-fill"></div><div class="rail left"></div><div class="rail right"></div>
      <div id="reel-content" class="clip" data-start="0" data-duration="9" data-track-index="1">
        <section id="scene-hook" class="scene"><div class="meta">01 / SIGNAL</div><div class="copy"><div class="support">THE SIGNAL:</div><div class="hero gold" data-var-text="hook">AI SEARCH CHANGED</div></div></section>
        <section id="scene-tension" class="scene"><div class="copy"><div class="support">THE GAP</div><div class="hero" data-var-text="tension">Ranking and recommendation are not the same signal</div></div></section>
        <section id="scene-compare" class="scene"><div class="panel top"><div class="hero" data-var-text="comparisonTop">VISIBLE</div></div><div class="panel bottom"><div class="hero gold" data-var-text="comparisonBottom">AI READY</div></div><div class="neq">≠</div></section>
        <section id="scene-diagnostic" class="scene"><div class="meta">02 / DIAGNOSTIC</div><div class="copy"><div class="hero" data-var-text="diagnostic">FIND THE VISIBILITY GAP</div><div class="hero box">MEASURE IT.</div></div></section>
        <section id="scene-cta" class="scene"><div class="copy"><div class="support">NEXT MOVE</div><div class="hero" data-var-text="cta">RUN A FREE AI VISIBILITY SCAN</div></div><div class="url" data-var-text="url">getgeopulse.com</div><div class="source">Research: <span data-var-text="sourceLabel">Source-linked research</span></div></section>
        <div class="scan"></div>
      </div>
      <audio id="pulse-bed" class="clip" src="assets/pulse-bed.wav" data-start="0" data-duration="9" data-track-index="10" data-volume="0.55"></audio>
    </div>
    <script>
      window.__timelines=window.__timelines||{};const variables=window.__hyperframes.getVariables();document.getElementById("stage").dataset.variant=variables.variant;const tl=gsap.timeline({paused:true});
      tl.set(".scene",{opacity:0},0);tl.set(".scan",{scaleX:.08,y:-340},0);
      tl.to("#scene-hook",{opacity:1,duration:.1},.08).fromTo("#scene-hook .hero",{opacity:0,x:-130},{opacity:1,x:0,duration:.5,ease:"power4.out"},.18).to(".scan",{scaleX:1,duration:.75,ease:"expo.out"},.1).to("#scene-hook",{opacity:0,duration:.14},1.55);
      tl.to("#scene-tension",{opacity:1,duration:.1},1.7).fromTo("#scene-tension .hero",{opacity:0,x:180},{opacity:1,x:0,duration:.55,ease:"expo.out"},1.82).to(".scan",{y:220,duration:.7,ease:"power2.inOut"},1.78).to("#scene-tension",{opacity:0,duration:.14},3.12);
      tl.to("#scene-compare",{opacity:1,duration:.1},3.25).fromTo("#scene-compare .top",{opacity:0,x:-160},{opacity:1,x:0,duration:.38,ease:"power4.out"},3.34).fromTo("#scene-compare .bottom",{opacity:0,x:160},{opacity:1,x:0,duration:.42,ease:"expo.out"},3.54).fromTo(".neq",{opacity:0,scale:.45},{opacity:1,scale:1,duration:.34,ease:"back.out(1.6)"},3.8).to("#scene-compare",{opacity:0,duration:.14},4.85);
      tl.to("#scene-diagnostic",{opacity:1,duration:.1},5).fromTo("#scene-diagnostic .copy",{opacity:0,y:110},{opacity:1,y:0,duration:.48,ease:"power4.out"},5.12).to(".scan",{y:390,duration:.75,ease:"sine.inOut"},5.05).to("#scene-diagnostic",{opacity:0,duration:.14},6.45);
      tl.to("#scene-cta",{opacity:1,duration:.1},6.6).fromTo("#scene-cta .hero",{opacity:0,scale:.72,x:-80},{opacity:1,scale:1,x:0,duration:.52,ease:"back.out(1.5)"},6.72).fromTo("#scene-cta .url",{opacity:0,y:80},{opacity:1,y:0,duration:.42,ease:"expo.out"},7.42).fromTo("#scene-cta .source",{opacity:0},{opacity:1,duration:.3},7.9).to(".scan",{y:330,opacity:0,duration:.5},6.8).to(".frame-fill",{scale:1.015,duration:2,ease:"sine.inOut"},6.7);
      tl.seek(0);window.__timelines["jordan-kinetic-reel"]=tl;
    </script>
  </body>
</html>

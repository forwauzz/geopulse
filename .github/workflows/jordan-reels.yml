name: Jordan Reel production

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: jordan-reel-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Reel media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Ensure HyperFrames browser
        run: npx --yes hyperframes@0.7.107 browser ensure
      - name: Render next approved Reel brief
        env:
          JORDAN_REEL_ENDPOINT: https://getgeopulse.com/api/internal/jordan-reels
          JORDAN_REEL_RENDER_SECRET: ${{ secrets.JORDAN_REEL_RENDER_SECRET }}
        run: node scripts/render-jordan-reel.mjs

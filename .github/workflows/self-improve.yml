# Autonomous self-improvement safety gates and observable audit trigger.
name: self-improve

on:
  # The production Cloudflare Worker is the single recurring audit scheduler. Keeping this
  # workflow manual prevents a duplicate forced audit after the canonical noon run.
  workflow_dispatch:
    inputs:
      run_audit:
        description: "Trigger a fresh self-audit on getgeopulse.com"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Cloudflare Worker types
        run: npm run cf-typegen
      - name: Type-check
        run: npm run type-check
      - name: Tests
        run: npm run test
      - name: Worker build
        run: node scripts/opennext-build.cjs

  trigger-audit:
    needs: gates
    runs-on: ubuntu-latest
    if: ${{ inputs.run_audit }}
    steps:
      - name: Trigger self-audit
        env:
          SECRET: ${{ secrets.SELF_IMPROVE_TRIGGER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$SECRET" ]; then
            echo "::error::SELF_IMPROVE_TRIGGER_SECRET is not configured; the audit was not triggered."
            exit 1
          fi
          curl --fail-with-body -sS -X POST https://getgeopulse.com/api/admin/self-improve \
            -H "content-type: application/json" \
            -H "x-self-improve-secret: $SECRET" \
            -d '{"action":"run"}'
